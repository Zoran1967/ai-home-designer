name: Napravi APK

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repo
        uses: actions/checkout@v4

      - name: Podesi Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Podesi Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pokreni testove
        run: gradle testDebugUnitTest --stacktrace

      - name: Izgradi debug APK
        run: gradle assembleDebug --stacktrace

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-home-designer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Sačuvaj šeme baze
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn
